name: Gemini PR Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google GenAI SDK
        run: pip install google-generativeai

      - name: Fetch PR Diff and Generate Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr diff $PR_NUMBER > pr_diff.txt
          
          cat << 'EOF' > review.py
          import os
          import google.generativeai as genai

          genai.configure(api_key=os.environ["GEMINI_API_KEY"])
          model = genai.GenerativeModel("gemini-1.5-flash")

          with open("pr_diff.txt", "r", encoding="utf-8") as f:
              diff_text = f.read()

          if not diff_text.strip():
              exit(0)

          prompt = f"""
          أنت مراجع أكواد خبير. يرجى مراجعة التغييرات التالية الخاصة بطلب سحب (Pull Request).
          ابحث عن الأخطاء البرمجية، الثغرات الأمنية، وتحسينات الأداء.
          اكتب مراجعتك باللغة العربية، واستخدم الـ Markdown لتنسيق الكود، وكن مختصراً ومفيداً.
          
          التغييرات:
          {diff_text}
          """
          
          try:
              response = model.generate_content(prompt)
              with open("comment.txt", "w", encoding="utf-8") as f:
                  f.write("🤖 **مراجعة Gemini التلقائية:**\n\n" + response.text)
          except Exception as e:
              with open("comment.txt", "w", encoding="utf-8") as f:
                  f.write(f"خطأ في الاتصال: {str(e)}")
          EOF

          python review.py
          
          if [ -s comment.txt ]; then
            gh pr comment $PR_NUMBER -F comment.txt
          fi

