name: Build MT7612U (OOT from original tree)

on:
  workflow_dispatch:

jobs:
  build-mt7612u-oot:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Wild build environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: android16-6.12
          sublevel: "30"

      - name: Download Android 16 kernel
        uses: ./.github/actions/download-kernel
        with:
          version: android16-6.12
          android_version: android16
          kernel_version: "6.12"
          os_patch_level: "2025-07"

      - name: Fix Kleaf header glob
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          FILE="build/kernel/kleaf/impl/kernel_build.bzl"
          if [ -f "$FILE" ]; then
            sed -i "s/-name \*\.h -print0/-name '*.h' -print0/g" "$FILE"
          fi
          echo "=== KLEAF HEADER GLOB ==="
          grep -nF -- "-name '*.h' -print0" "$FILE" || true

      - name: Pin exact Android 16 6.12.30 source (r7)
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d common/.git ]; then
            rm -rf common
            git clone --depth=1 --branch android16-6.12-2025-07_r7 \
              https://android.googlesource.com/kernel/common common
          else
            cd common
            git fetch --depth=1 https://android.googlesource.com/kernel/common android16-6.12-2025-07_r7
            git checkout -f --detach FETCH_HEAD
          fi

          cd common
          COMMIT="$(git rev-parse HEAD)"
          echo "=== SOURCE COMMIT ==="
          echo "$COMMIT"
          test "$COMMIT" = "6e872b4863d6dd892490c32d973db1a9df8d3710"
          echo "=== EXACT r7 SOURCE VERIFIED ==="

      - name: Prepare MT76 OOT from original tree
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          SRC="common/drivers/net/wireless/mediatek/mt76"
          EXT="mt76_ext"

          echo "=== VERIFY ORIGINAL SOURCE ==="
          test -f "$SRC/Makefile"
          test -f "$SRC/Kconfig"
          test -f "$SRC/mt76x2/Makefile"
          test -f "$SRC/mt76x2/Kconfig"

          echo "=== COPYING ORIGINAL MT76 TREE ==="
          rm -rf "$EXT"
          mkdir -p "$EXT"
          cp -a "$SRC" "$EXT/mt76"

          echo "=== CREATE CLEAN WRAPPER Makefile (safe method) ==="

          {
            echo 'KDIR ?= $(KERNEL_SRC)'
            echo ''
            echo '.PHONY: all modules modules_install clean'
            echo ''
            echo 'all modules:'
            echo -e '\t$(MAKE) -C $(KDIR) M=$(CURDIR)/mt76 \\'
            echo -e '\t\tCONFIG_MT76_CORE=m \\'
            echo -e '\t\tCONFIG_MT76_USB=m \\'
            echo -e '\t\tCONFIG_MT76x02_LIB=m \\'
            echo -e '\t\tCONFIG_MT76x02_USB=m \\'
            echo -e '\t\tCONFIG_MT76x2_COMMON=m \\'
            echo -e '\t\tCONFIG_MT76x2U=m \\'
            echo -e '\t\tmodules'
            echo ''
            echo 'modules_install:'
            echo -e '\t$(MAKE) -C $(KDIR) M=$(CURDIR)/mt76 \\'
            echo -e '\t\tCONFIG_MT76_CORE=m \\'
            echo -e '\t\tCONFIG_MT76_USB=m \\'
            echo -e '\t\tCONFIG_MT76x02_LIB=m \\'
            echo -e '\t\tCONFIG_MT76x02_USB=m \\'
            echo -e '\t\tCONFIG_MT76x2_COMMON=m \\'
            echo -e '\t\tCONFIG_MT76x2U=m \\'
            echo -e '\t\tmodules_install'
            echo ''
            echo 'clean:'
            echo -e '\t$(MAKE) -C $(KDIR) M=$(CURDIR)/mt76 clean'
          } > "$EXT/Makefile"

          echo "=== WRAPPER Makefile ==="
          cat -A "$EXT/Makefile"

          echo "=== VERIFY STRUCTURE ==="
          test -f "$EXT/Makefile"
          test -f "$EXT/mt76/Makefile"
          test -f "$EXT/mt76/mt76x2/Makefile"
          ls -la "$EXT/mt76/mt76x2/"

          echo "=== PREPARATION COMPLETE ==="

      - name: Define MT76 Bazel target
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          cat > mt76_ext/BUILD.bazel << 'EOF'
          load("//build/kernel/kleaf:kernel.bzl", "kernel_module")

          kernel_module(
              name = "mt76_ext_module",
              kernel_build = "//common:kernel_aarch64",
              makefile = [":Makefile"],
              srcs = glob([
                  "mt76/**/*.c",
                  "mt76/**/*.h",
                  "mt76/**/Makefile",
                  "mt76/**/Kconfig",
                  "Makefile",
              ]),
              outs = [
                  "mt76.ko",
                  "mt76-usb.ko",
                  "mt76x02-lib.ko",
                  "mt76x02-usb.ko",
                  "mt76x2-common.ko",
                  "mt76x2u.ko",
              ],
              visibility = ["//visibility:public"],
          )
          EOF

          echo "=== BUILD.bazel ==="
          cat mt76_ext/BUILD.bazel

          tools/bazel query //mt76_ext:mt76_ext_module

      - name: Build MT76 OOT
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " BUILDING //mt76_ext:mt76_ext_module"
          echo "=========================================="

          tools/bazel build \
            --config=fast \
            --config=stamp \
            --notrim \
            --disk_cache=/home/runner/.cache/bazel \
            --allow_undeclared_modules \
            --preserve_kbuild_output \
            --verbose_failures \
            --subcommands \
            //mt76_ext:mt76_ext_module

          echo "=== BUILD SUCCESSFUL ==="

      - name: Collect MT76 modules
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf mt76-artifact
          mkdir -p mt76-artifact

          for name in \
            mt76.ko \
            mt76-usb.ko \
            mt76x02-lib.ko \
            mt76x02-usb.ko \
            mt76x2-common.ko \
            mt76x2u.ko
          do
            src="$(find bazel-bin bazel-out -type f -name "$name" -print -quit 2>/dev/null || true)"

            if [ -z "$src" ]; then
              echo "ERROR: MODULE NOT FOUND → $name"
              echo "=== ALL .ko FILES ==="
              find bazel-bin bazel-out -type f -name '*.ko' | sort | head -100 || true
              exit 1
            fi

            echo "FOUND: $src"
            cp -L "$src" "mt76-artifact/$name"
          done

          echo "=== FINAL ARTIFACTS ==="
          ls -lh mt76-artifact/

      - name: Deep inspection
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          for f in mt76-artifact/*.ko; do
            echo
            echo "========== $f =========="
            echo "[NAME]     $(modinfo -F name "$f" 2>/dev/null || echo N/A)"
            echo "[VERMAGIC] $(modinfo -F vermagic "$f" 2>/dev/null || strings "$f" | grep '^vermagic=' || echo N/A)"
            echo "[DEPENDS]  $(modinfo -F depends "$f" 2>/dev/null || echo N/A)"
            echo "[FIRMWARE] $(modinfo -F firmware "$f" 2>/dev/null || echo N/A)"

            if readelf -S "$f" | grep -q '\.BTF'; then
              echo "[BTF]      PRESENT"
            else
              echo "[BTF]      ABSENT"
            fi

            if readelf -S "$f" | grep -q '__versions'; then
              echo "[MODVER]   PRESENT"
            else
              echo "[MODVER]   ABSENT"
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MT7612U-OOT-r7-from-original-tree
          path: kernel/mt76-artifact/
          if-no-files-found: error
