name: Build MT7612U (In-Tree Strict)

on:
  workflow_dispatch:

jobs:
  build-mt7612u-intree:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Wild build environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: android16-6.12
          sublevel: "30"

      - name: Download Android 16 kernel
        uses: ./.github/actions/download-kernel
        with:
          version: android16-6.12
          android_version: android16
          kernel_version: "6.12"
          os_patch_level: "2025-07"

      - name: Fix Kleaf header glob
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          FILE="build/kernel/kleaf/impl/kernel_build.bzl"

          if [ -f "$FILE" ]; then
            sed -i \
              "s/-name \*\.h -print0/-name '*.h' -print0/g" \
              "$FILE"
          fi

          echo "=== KLEAF HEADER GLOB ==="
          grep -nF -- "-name '*.h' -print0" "$FILE" || true

      - name: Pin exact Android 16 6.12.30 source (r7)
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d common/.git ]; then
            rm -rf common
            git clone \
              --depth=1 \
              --branch android16-6.12-2025-07_r7 \
              https://android.googlesource.com/kernel/common \
              common
          else
            cd common
            git fetch --depth=1 \
              https://android.googlesource.com/kernel/common \
              android16-6.12-2025-07_r7
            git checkout -f --detach FETCH_HEAD
          fi

          cd common
          COMMIT="$(git rev-parse HEAD)"
          echo "=== SOURCE COMMIT ==="
          echo "$COMMIT"
          test "$COMMIT" = "6e872b4863d6dd892490c32d973db1a9df8d3710"
          echo "=== EXACT ANDROID r7 SOURCE VERIFIED ==="

      - name: Prepare MT7612U in-tree module
        working-directory: kernel/common
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== VERIFY EXACT MT76 SOURCE ==="
          test -f drivers/net/wireless/mediatek/mt76/Makefile
          test -f drivers/net/wireless/mediatek/mt76/Kconfig
          test -f drivers/net/wireless/mediatek/mt76/mt76x2/Makefile
          test -f drivers/net/wireless/mediatek/mt76/mt76x2/Kconfig

          echo "=== CREATE MT7612U CONFIG FRAGMENT ==="
          cat > arch/arm64/configs/mt7612u_defconfig <<'EOF'
          CONFIG_WLAN_VENDOR_MEDIATEK=y
          CONFIG_MT76_CORE=m
          CONFIG_MT76_USB=m
          CONFIG_MT76X02_LIB=m
          CONFIG_MT76X02_USB=m
          CONFIG_MT76X2_COMMON=m
          CONFIG_MT76X2U=m
          EOF

          test -s arch/arm64/configs/mt7612u_defconfig
          echo "=== MT7612U CONFIG ==="
          cat arch/arm64/configs/mt7612u_defconfig

          echo "=== EXPORT DEFCONFIG TO BAZEL ==="
          if ! grep -qF 'exports_files(["arch/arm64/configs/mt7612u_defconfig"])' BUILD.bazel; then
            printf '\nexports_files(["arch/arm64/configs/mt7612u_defconfig"])\n' >> BUILD.bazel
          fi
          grep -qF 'exports_files(["arch/arm64/configs/mt7612u_defconfig"])' BUILD.bazel

          echo "=== REMOVE OLD EXTERNAL MODULE BUILD FILE (if any) ==="
          rm -f drivers/net/wireless/mediatek/mt76/BUILD.bazel

          echo "=== VERIFY kernel_aarch64 EXISTS EXACTLY ONCE ==="
          COUNT=$(grep -c 'name = "kernel_aarch64",' BUILD.bazel || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: expected exactly 1 kernel_aarch64 target, found $COUNT"
            exit 1
          fi

          echo "=== PATCH kernel_aarch64 (STRICT) ==="
          python3 <<'PY'
          from pathlib import Path

          p = Path("BUILD.bazel")
          s = p.read_text()

          anchor = 'name = "kernel_aarch64",'
          if s.count(anchor) != 1:
              raise SystemExit(f"ERROR: expected exactly one kernel_aarch64, found {s.count(anchor)}")

          pos = s.index(anchor)

          # Find the start of this common_kernel( call
          start = s.rfind("common_kernel(", 0, pos)
          if start < 0:
              raise SystemExit("ERROR: kernel_aarch64 is not inside common_kernel()")

          # Find the matching closing parenthesis (balanced, ignoring strings)
          depth = 0
          end = None
          in_string = False
          escape = False
          for i in range(start, len(s)):
              c = s[i]
              if in_string:
                  if escape:
                      escape = False
                  elif c == "\\":
                      escape = True
                  elif c == '"':
                      in_string = False
                  continue
              if c == '"':
                  in_string = True
              elif c == "(":
                  depth += 1
              elif c == ")":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit("ERROR: could not find end of common_kernel() for kernel_aarch64")

          block = s[start:end]

          if 'name = "kernel_aarch64",' not in block:
              raise SystemExit("ERROR: block detection failed")

          # Strict safety checks — refuse to touch if already modified or unexpected
          if "module_outs =" in block:
              raise SystemExit(
                  "ERROR: kernel_aarch64 already contains module_outs. "
                  "Refusing to overwrite unexpected existing list."
              )
          if "pre_defconfig_fragments" in block:
              raise SystemExit(
                  "ERROR: kernel_aarch64 already contains pre_defconfig_fragments."
              )
          if 'check_defconfig = "disabled"' in block:
              raise SystemExit(
                  "ERROR: kernel_aarch64 already contains check_defconfig = \"disabled\"."
              )

          insertion = '''name = "kernel_aarch64",
              check_defconfig = "disabled",
              pre_defconfig_fragments = [
                  "arch/arm64/configs/mt7612u_defconfig",
              ],
              module_outs = [
                  "drivers/net/wireless/mediatek/mt76/mt76.ko",
                  "drivers/net/wireless/mediatek/mt76/mt76-usb.ko",
                  "drivers/net/wireless/mediatek/mt76/mt76x02-lib.ko",
                  "drivers/net/wireless/mediatek/mt76/mt76x02-usb.ko",
                  "drivers/net/wireless/mediatek/mt76/mt76x2/mt76x2-common.ko",
                  "drivers/net/wireless/mediatek/mt76/mt76x2/mt76x2u.ko",
              ],'''

          new_block = block.replace('name = "kernel_aarch64",', insertion, 1)
          if new_block == block:
              raise SystemExit("ERROR: patch made no changes")

          s = s[:start] + new_block + s[end:]
          p.write_text(s)
          print("=== PATCH APPLIED SUCCESSFULLY ===")
          PY

          echo "=== VERIFY PATCH ==="
          grep -n -A45 -B2 'name = "kernel_aarch64"' BUILD.bazel

          echo "=== VERIFY ALL SIX MODULE OUTPUTS ==="
          for module in \
            'drivers/net/wireless/mediatek/mt76/mt76.ko' \
            'drivers/net/wireless/mediatek/mt76/mt76-usb.ko' \
            'drivers/net/wireless/mediatek/mt76/mt76x02-lib.ko' \
            'drivers/net/wireless/mediatek/mt76/mt76x02-usb.ko' \
            'drivers/net/wireless/mediatek/mt76/mt76x2/mt76x2-common.ko' \
            'drivers/net/wireless/mediatek/mt76/mt76x2/mt76x2u.ko'
          do
            grep -qF "\"$module\"" BUILD.bazel || {
              echo "ERROR: missing module output: $module"
              exit 1
            }
          done

          echo "=== VERIFY DEFCONFIG IS EXPORTED ==="
          grep -qF 'exports_files(["arch/arm64/configs/mt7612u_defconfig"])' BUILD.bazel

          echo "=== MT7612U PREPARATION COMPLETE ==="

      - name: Build Android 16 6.12.30 kernel + MT76 modules
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " BUILDING //common:kernel_aarch64"
          echo "=========================================="

          tools/bazel build \
            --config=fast \
            --config=stamp \
            --disk_cache=/home/runner/.cache/bazel \
            --allow_undeclared_modules \
            --preserve_kbuild_output \
            --verbose_failures \
            //common:kernel_aarch64

          echo "=== BUILD FINISHED ==="

      - name: Locate MT76 modules
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== SEARCHING FOR MODULES ==="
          find bazel-bin bazel-out \
            -type f \
            \( \
              -name 'mt76.ko' -o \
              -name 'mt76-usb.ko' -o \
              -name 'mt76x02-lib.ko' -o \
              -name 'mt76x02-usb.ko' -o \
              -name 'mt76x2-common.ko' -o \
              -name 'mt76x2u.ko' \
            \) \
            -print

      - name: Collect MT76 modules
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf mt76-artifact
          mkdir -p mt76-artifact

          for name in \
            mt76.ko \
            mt76-usb.ko \
            mt76x02-lib.ko \
            mt76x02-usb.ko \
            mt76x2-common.ko \
            mt76x2u.ko
          do
            src="$(
              find bazel-bin bazel-out \
                -type f \
                -name "$name" \
                -print -quit 2>/dev/null || true
            )"

            if [ -z "$src" ]; then
              echo "ERROR: REQUIRED MODULE NOT FOUND: $name"
              echo "=== AVAILABLE KO FILES ==="
              find bazel-bin bazel-out -type f -name '*.ko' | sort | head -200 || true
              exit 1
            fi

            echo "FOUND: $src"
            cp -L "$src" "mt76-artifact/$name"
          done

          echo "=== SIX MODULES ==="
          ls -lh mt76-artifact/

      - name: Deep inspection
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " MT76 INSPECTION"
          echo "=========================================="

          for f in mt76-artifact/*.ko; do
            echo
            echo "------------------------------------------"
            echo "FILE: $f"
            echo "------------------------------------------"

            echo "[NAME]"
            modinfo -F name "$f" 2>/dev/null || true

            echo "[VERMAGIC]"
            modinfo -F vermagic "$f" 2>/dev/null || \
              strings "$f" | grep '^vermagic=' || true

            echo "[DEPENDS]"
            modinfo -F depends "$f" 2>/dev/null || \
              strings "$f" | grep '^depends=' || true

            echo "[FIRMWARE]"
            modinfo -F firmware "$f" 2>/dev/null || \
              strings "$f" | grep '^firmware=' || true

            echo "[BTF]"
            if readelf -S "$f" | grep -q '\.BTF'; then
              echo "BTF: PRESENT"
            else
              echo "BTF: ABSENT"
            fi

            echo "[MODVERSIONS]"
            if readelf -S "$f" | grep -q '__versions'; then
              echo "__versions: PRESENT"
            else
              echo "__versions: ABSENT"
            fi
          done

      - name: Verify MT7612U firmware references
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== FIRMWARE REFERENCES ==="
          grep -RhoE 'mt7662(_rom_patch)?\.bin' common/drivers/net/wireless/mediatek/mt76 | sort -u || true

      - name: Upload verified MT76 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MT7612U-InTree-Wild-6.12.30-r7
          path: kernel/mt76-artifact/
          if-no-files-found: error
