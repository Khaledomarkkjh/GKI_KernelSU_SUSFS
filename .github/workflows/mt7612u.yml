name: Build MT7612U (External Kernel Module)

on:
  workflow_dispatch:

jobs:
  build-mt7612u-oot:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Wild build environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: android16-6.12
          sublevel: "30"

      - name: Download Android 16 kernel
        uses: ./.github/actions/download-kernel
        with:
          version: android16-6.12
          android_version: android16
          kernel_version: "6.12"
          os_patch_level: "2025-07"

      - name: Fix Kleaf header glob
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          FILE="build/kernel/kleaf/impl/kernel_build.bzl"

          if [ -f "$FILE" ]; then
            sed -i \
              "s/-name \*\.h -print0/-name '*.h' -print0/g" \
              "$FILE"
          fi

          echo "=== KLEAF HEADER GLOB ==="
          grep -nF -- "-name '*.h' -print0" "$FILE" || true

      - name: Pin exact Android 16 6.12.30 source
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf common

          git clone \
            --depth=1 \
            --branch android16-6.12-2025-07_r7 \
            https://android.googlesource.com/kernel/common \
            common

          cd common

          COMMIT="$(git rev-parse HEAD)"

          echo "=== SOURCE COMMIT ==="
          echo "$COMMIT"

          test "$COMMIT" = \
            "6e872b4863d6dd892490c32d973db1a9df8d3710"

          echo "=== EXACT ANDROID R7 SOURCE VERIFIED ==="

      - name: Prepare MT76 OOT workspace
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          SRC="common/drivers/net/wireless/mediatek/mt76"
          EXT="mt76_ext"

          echo "=========================================="
          echo " VERIFYING MT76 SOURCE"
          echo "=========================================="

          test -d "$SRC"
          test -f "$SRC/Makefile"
          test -f "$SRC/Kconfig"

          echo "=== ORIGINAL MT76 MAKEFILE ==="
          cat "$SRC/Makefile"

          echo "=== MT76 TREE ==="
          find "$SRC" \
            -maxdepth 2 \
            -type f \
            \( \
              -name '*.c' -o \
              -name '*.h' -o \
              -name 'Kbuild' -o \
              -name 'Kconfig' -o \
              -name 'Makefile' \
            \) \
            | sort

          echo "=========================================="
          echo " COPYING MT76 TREE"
          echo "=========================================="

          rm -rf "$EXT"
          mkdir -p "$EXT"

          cp -a "$SRC/." "$EXT/"

          test -f "$EXT/Makefile"
          test -f "$EXT/Kconfig"

          echo "=== MT76 COPY VERIFIED ==="

          echo "=== SEARCH MT76X2U REFERENCES ==="

          grep -RniE \
            'MT76X2U|mt76x2u|mt76x2-common|MT76X2_COMMON' \
            "$EXT" \
            --include='Makefile' \
            --include='Kbuild' \
            --include='Kconfig' \
            | head -100 || true

          echo "=== SEARCH MT7612U FIRMWARE ==="

          grep -RniE \
            'mt7662(_rom_patch)?\.bin' \
            "$EXT" \
            --include='*.c' \
            --include='*.h' \
            --include='Makefile' \
            --include='Kbuild' \
            --include='Kconfig' \
            | head -100 || true

          echo "=== MT76 OOT SOURCE READY ==="

      - name: Preflight MT76 OOT tree
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " MT76 PRE-FLIGHT"
          echo "=========================================="

          test -d mt76_ext
          test -f mt76_ext/Makefile
          test -f mt76_ext/Kconfig

          echo "=== MAKEFILE ==="
          sed -n '1,240p' mt76_ext/Makefile

          echo "=== KCONFIG ==="
          sed -n '1,240p' mt76_ext/Kconfig

          echo "=== TOP LEVEL ==="
          find mt76_ext \
            -maxdepth 1 \
            -type f \
            | sort

          echo "=== SUBDIRECTORIES ==="
          find mt76_ext \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort

          echo "=== MT76X2 DIRECTORY ==="

          if [ -d mt76_ext/mt76x2 ]; then
            find mt76_ext/mt76x2 \
              -maxdepth 1 \
              -type f \
              | sort
          fi

          echo "=== PRE-FLIGHT COMPLETE ==="

      - name: Define MT76 Bazel target
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          cat > mt76_ext/BUILD.bazel <<'EOF'
          load("//build/kernel/kleaf:kernel.bzl", "kernel_module")

          kernel_module(
              name = "mt76_ext_module",

              kernel_build = "//common:kernel_aarch64",

              makefile = "//mt76_ext:Makefile",

              srcs = glob([
                  "**/*.c",
                  "**/*.h",
                  "**/Kbuild",
                  "**/Kconfig",
                  "**/Makefile",
              ]),

              outs = [
                  "mt76.ko",
                  "mt76-usb.ko",
                  "mt76x02-lib.ko",
                  "mt76x02-usb.ko",
                  "mt76x2.ko",
                  "mt76x2u.ko",
              ],

              visibility = ["//visibility:public"],
          )
          EOF

          echo "=== BUILD.BAZEL ==="
          cat mt76_ext/BUILD.bazel

          echo "=== BAZEL QUERY ==="
          tools/bazel query //mt76_ext:mt76_ext_module

      - name: Build MT76 OOT
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " BUILDING MT7612U / MT76 OOT"
          echo "=========================================="

          tools/bazel build \
            --config=fast \
            --config=stamp \
            --notrim \
            --disk_cache=/home/runner/.cache/bazel \
            --allow_undeclared_modules \
            --preserve_kbuild_output \
            --verbose_failures \
            --subcommands \
            //mt76_ext:mt76_ext_module

          echo
          echo "=== OOT BUILD SUCCESSFUL ==="

      - name: Locate MT76 modules
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " SEARCHING FOR MT76 MODULES"
          echo "=========================================="

          find bazel-bin bazel-out \
            -type f \
            -name '*.ko' \
            | sort

      - name: Collect MT76 modules
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf mt76-artifact
          mkdir -p mt76-artifact

          echo "=========================================="
          echo " COLLECTING MT76 MODULES"
          echo "=========================================="

          found=0

          while IFS= read -r src; do
            name="$(basename "$src")"

            case "$name" in
              mt76.ko|\
              mt76-usb.ko|\
              mt76x02-lib.ko|\
              mt76x02-usb.ko|\
              mt76x2.ko|\
              mt76x2u.ko)

                echo "FOUND: $src"

                cp -L "$src" "mt76-artifact/$name"
                found=$((found + 1))
                ;;
            esac

          done < <(
            find bazel-bin bazel-out \
              -type f \
              -name '*.ko' \
              -print \
              2>/dev/null \
              | sort
          )

          echo
          echo "=== COLLECTED MODULES ==="

          ls -lh mt76-artifact/

          if [ "$found" -eq 0 ]; then
            echo "ERROR: NO MT76 MODULES WERE PRODUCED"

            echo
            echo "=== ALL KO FILES ==="

            find bazel-bin bazel-out \
              -type f \
              -name '*.ko' \
              | sort || true

            exit 1
          fi

          echo
          echo "=== MODULE COUNT: $found ==="

      - name: Deep inspection
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " MT76 INSPECTION"
          echo "=========================================="

          for f in mt76-artifact/*.ko; do

            echo
            echo "------------------------------------------"
            echo "FILE: $f"
            echo "------------------------------------------"

            echo "[NAME]"
            modinfo -F name "$f" 2>/dev/null || true

            echo "[VERMAGIC]"
            modinfo -F vermagic "$f" 2>/dev/null || \
              strings "$f" | grep '^vermagic=' || true

            echo "[DEPENDS]"
            modinfo -F depends "$f" 2>/dev/null || \
              strings "$f" | grep '^depends=' || true

            echo "[FIRMWARE]"
            modinfo -F firmware "$f" 2>/dev/null || \
              strings "$f" | grep '^firmware=' || true

            echo "[BTF]"
            if readelf -S "$f" | grep -q '\.BTF'; then
              echo "BTF: PRESENT"
            else
              echo "BTF: ABSENT"
            fi

            echo "[MODVERSIONS]"
            if readelf -S "$f" | grep -q '__versions'; then
              echo "__versions: PRESENT"
            else
              echo "__versions: ABSENT"
            fi

          done

      - name: Verify MT7612U firmware references
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " FIRMWARE REFERENCES"
          echo "=========================================="

          grep -RhoE \
            'mt7662(_rom_patch)?\.bin' \
            mt76_ext \
            | sort -u || true

      - name: Upload verified MT76 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MT7612U-OOT-Wild-6.12.30-r7
          path: kernel/mt76-artifact/
          if-no-files-found: error
