name: Build MT7612U (External Kernel Module)

on:
  workflow_dispatch:

jobs:
  build-mt7612u-oot:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Wild build environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: android16-6.12
          sublevel: "30"

      - name: Download Android 16 kernel
        uses: ./.github/actions/download-kernel
        with:
          version: android16-6.12
          android_version: android16
          kernel_version: "6.12"
          os_patch_level: "2025-07"

      - name: Fix Kleaf header glob
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          FILE="build/kernel/kleaf/impl/kernel_build.bzl"

          if [ -f "$FILE" ]; then
            sed -i \
              "s/-name \*\.h -print0/-name '*.h' -print0/g" \
              "$FILE"
          fi

          echo "=== KLEAF HEADER GLOB CHECK ==="
          grep -nF -- "-name '*.h' -print0" "$FILE" || true

      - name: Pin exact Android 16 6.12.30 source
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d common/.git ]; then
            rm -rf common

            git clone \
              --depth=1 \
              --branch android16-6.12-2025-07_r7 \
              https://android.googlesource.com/kernel/common \
              common
          else
            cd common

            git fetch \
              --depth=1 \
              https://android.googlesource.com/kernel/common \
              android16-6.12-2025-07_r7

            git checkout -f --detach FETCH_HEAD
          fi

          cd common

          COMMIT="$(git rev-parse HEAD)"

          echo "=== SOURCE COMMIT ==="
          echo "$COMMIT"

          test "$COMMIT" = \
            "6e872b4863d6dd892490c32d973db1a9df8d3710"

          echo "=== EXACT ANDROID R7 SOURCE VERIFIED ==="

      - name: Prepare MT76 OOT workspace
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          SRC="common/drivers/net/wireless/mediatek/mt76"
          EXT="mt76_ext"

          test -d "$SRC"
          test -f "$SRC/Makefile"
          test -f "$SRC/Kconfig"
          test -f "$SRC/mt76x2/Makefile"
          test -f "$SRC/mt76x2/Kconfig"

          rm -rf "$EXT"
          mkdir -p "$EXT"

          echo "=== COPYING MT76 SOURCE ==="

          cp -a "$SRC/." "$EXT/"

          echo "=== SOURCE TREE ==="
          find "$EXT" -maxdepth 2 -type f \
            | sort \
            | head -100

          echo "=== CREATE OOT WRAPPER MAKEFILE ==="

          cat > "$EXT/Makefile" <<'EOF'
          KDIR ?= $(KERNEL_SRC)
          M := $(CURDIR)

          .PHONY: all modules clean

          all modules:
          	$(MAKE) -C $(KDIR) M=$(M) modules

          clean:
          	$(MAKE) -C $(KDIR) M=$(M) clean
          EOF

          echo "=== CREATE OOT KBUILD ==="

          cat > "$EXT/Kbuild" <<'EOF'
          # MT76 OOT Kbuild
          #
          # Use the original MT76 build description.
          # Configuration is supplied explicitly for the OOT build.

          CONFIG_MT76_CORE := m
          CONFIG_MT76_USB := m
          CONFIG_MT76X02_LIB := m
          CONFIG_MT76X02_USB := m
          CONFIG_MT76X2_COMMON := m
          CONFIG_MT76X2U := m

          obj-$(CONFIG_MT76_CORE) += mt76.o
          obj-$(CONFIG_MT76_USB) += mt76-usb.o
          obj-$(CONFIG_MT76X02_LIB) += mt76x02-lib.o
          obj-$(CONFIG_MT76X02_USB) += mt76x02-usb.o
          obj-$(CONFIG_MT76X2_COMMON) += mt76x2-common.o
          obj-$(CONFIG_MT76X2U) += mt76x2u.o

          mt76-y := $(filter-out $(mt76-y),$(wildcard $(src)/*.c))
          EOF

          echo "=== VERIFY OOT FILES ==="

          test -s "$EXT/Makefile"
          test -s "$EXT/Kbuild"

          echo "=== MAKEFILE ==="
          cat "$EXT/Makefile"

          echo "=== KBUILD ==="
          cat "$EXT/Kbuild"

      - name: Define MT76 Bazel module
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          cat > mt76_ext/BUILD.bazel <<'EOF'
          load("//build/kernel/kleaf:kernel.bzl", "kernel_module")

          kernel_module(
              name = "mt76_ext_module",
              kernel_build = "//common:kernel_aarch64",

              srcs = glob([
                  "**/*.c",
                  "**/*.h",
                  "**/Makefile",
                  "**/Kbuild",
                  "**/Kconfig",
              ]),

              makefile = "Makefile",

              outs = [
                  "mt76.ko",
                  "mt76-usb.ko",
                  "mt76x02-lib.ko",
                  "mt76x02-usb.ko",
                  "mt76x2-common.ko",
                  "mt76x2u.ko",
              ],

              visibility = ["//visibility:public"],
          )
          EOF

          echo "=== BUILD.BAZEL ==="
          cat mt76_ext/BUILD.bazel

          echo "=== BAZEL PACKAGE CHECK ==="

          tools/bazel query //mt76_ext:mt76_ext_module

      - name: Build MT76 OOT
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " BUILDING MT76 OUT-OF-TREE"
          echo "=========================================="

          tools/bazel build \
            --config=fast \
            --config=stamp \
            --notrim \
            --disk_cache=/home/runner/.cache/bazel \
            --allow_undeclared_modules \
            --preserve_kbuild_output \
            --verbose_failures \
            --subcommands \
            //mt76_ext:mt76_ext_module

          echo "=== OOT BUILD SUCCESSFUL ==="

      - name: Locate MT76 modules
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== SEARCHING BUILT MODULES ==="

          find bazel-bin bazel-out \
            -type f \
            \( \
              -name 'mt76.ko' -o \
              -name 'mt76-usb.ko' -o \
              -name 'mt76x02-lib.ko' -o \
              -name 'mt76x02-usb.ko' -o \
              -name 'mt76x2-common.ko' -o \
              -name 'mt76x2u.ko' \
            \) \
            -print

      - name: Collect MT76 modules
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf mt76-artifact
          mkdir -p mt76-artifact

          for name in \
            mt76.ko \
            mt76-usb.ko \
            mt76x02-lib.ko \
            mt76x02-usb.ko \
            mt76x2-common.ko \
            mt76x2u.ko
          do
            src="$(
              find bazel-bin bazel-out \
                -type f \
                -name "$name" \
                -print -quit 2>/dev/null || true
            )"

            if [ -z "$src" ]; then
              echo "ERROR: $name NOT FOUND"

              echo "=== ALL KO FILES ==="
              find bazel-bin bazel-out \
                -type f \
                -name '*.ko' \
                | sort \
                | head -200 || true

              exit 1
            fi

            echo "FOUND: $src"
            cp -L "$src" "mt76-artifact/$name"
          done

          echo "=== SIX MODULES ==="
          ls -lh mt76-artifact/

      - name: Deep MT76 inspection
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " MT76 MODULE INSPECTION"
          echo "=========================================="

          for f in mt76-artifact/*.ko; do

            echo
            echo "------------------------------------------"
            echo "FILE: $f"
            echo "------------------------------------------"

            echo "[VERMAGIC]"
            modinfo -F vermagic "$f" 2>/dev/null || \
              strings "$f" | grep '^vermagic=' || true

            echo "[DEPENDS]"
            modinfo -F depends "$f" 2>/dev/null || \
              strings "$f" | grep '^depends=' || true

            echo "[FIRMWARE]"
            modinfo -F firmware "$f" 2>/dev/null || \
              strings "$f" | grep '^firmware=' || true

            echo "[BTF]"
            if readelf -S "$f" | grep -q '\.BTF'; then
              echo "BTF: PRESENT"
            else
              echo "BTF: ABSENT"
            fi

            echo "[MODVERSIONS]"
            if readelf -S "$f" | grep -q '__versions'; then
              echo "__versions: PRESENT"
            else
              echo "__versions: ABSENT"
            fi

            echo "[NAME]"
            modinfo -F name "$f" 2>/dev/null || true

          done

      - name: Verify MT7612U firmware names
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== MT76 FIRMWARE REFERENCES ==="

          grep -RhoE \
            'mt7662(_rom_patch)?\.bin' \
            mt76_ext \
            | sort -u || true

      - name: Upload verified MT76 modules
        uses: actions/upload-artifact@v4
        with:
          name: MT7612U-OOT-Wild-6.12.30-r7
          path: kernel/mt76-artifact/
          if-no-files-found: error                  "mt76.ko",
                  "mt76-usb.ko",
                  "mt76x02-lib.ko",
                  "mt76x02-usb.ko",
                  "mt76x2/mt76x2-common.ko",
                  "mt76x2/mt76x2u.ko",
              ],
          )
          EOF

          echo "=== MT76 BUILD.BAZEL ==="
          cat drivers/net/wireless/mediatek/mt76/BUILD.bazel

          echo "=== BAZEL PACKAGE CHECK ==="
                  ../tools/bazel query //common/drivers/net/wireless/mediatek/mt76:mt76

      - name: Build MT76
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          echo "=== BUILDING MT76 EXTERNAL MODULE ==="

          tools/bazel build \
            --config=fast \
            --config=stamp \
            --disk_cache=/home/runner/.cache/bazel \
            --allow_undeclared_modules \
            --preserve_kbuild_output \
            --verbose_failures \
            --subcommands \
            //common/drivers/net/wireless/mediatek/mt76:mt76

          echo "=== MT76 BUILD FINISHED ==="

          echo "=== MT76 OUTPUTS ==="
          find bazel-bin \
            -type f \
            \( \
              -name 'mt76.ko' -o \
              -name 'mt76-usb.ko' -o \
              -name 'mt76x02-lib.ko' -o \
              -name 'mt76x02-usb.ko' -o \
              -name 'mt76x2-common.ko' -o \
              -name 'mt76x2u.ko' \
            \) \
            -print

      - name: Collect MT76 modules
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          rm -rf mt76-artifact
          mkdir -p mt76-artifact

          for name in \
            mt76.ko \
            mt76-usb.ko \
            mt76x02-lib.ko \
            mt76x02-usb.ko \
            mt76x2-common.ko \
            mt76x2u.ko
          do
            src="$(find bazel-bin \
              -type f \
              -name "$name" \
              -print -quit)"

            if [ -z "$src" ]; then
              echo "ERROR: REQUIRED MODULE NOT FOUND: $name"
              exit 1
            fi

            echo "COPYING: $src"
            cp -L "$src" "mt76-artifact/$name"
          done

          echo "=== ALL SIX MT76 MODULES ==="
          ls -lh mt76-artifact/

          echo "=== MODULE METADATA ==="
          for f in mt76-artifact/*.ko; do
            echo "================================"
            echo "$f"
            strings "$f" | \
              grep -E '^(name=|depends=|vermagic=)' || true
          done

      - name: Upload MT7612U modules
        uses: actions/upload-artifact@v4
        with:
          name: MT7612U-Wild-6.12.30-r7
          path: kernel/mt76-artifact/
          if-no-files-found: error
