name: Build MT7612U

on:
  workflow_dispatch:

jobs:
  build-mt7612u:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Wild build environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: android16-6.12
          sublevel: "30"

      - name: Download Android 16 kernel
        uses: ./.github/actions/download-kernel
        with:
          version: android16-6.12
          android_version: android16
          kernel_version: "6.12"
          os_patch_level: "2025-07"
          
      - name: Fix Kleaf header glob
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          FILE="build/kernel/kleaf/impl/kernel_build.bzl"

          grep -nF -- '-name *.h -print0' "$FILE"

          sed -i "s/-name \*\.h -print0/-name '*.h' -print0/g" "$FILE"

          echo "=== KLEAF HEADER GLOB FIXED ==="
          grep -nF -- "-name '*.h' -print0" "$FILE"

          
      - name: Pin exact Android 16 6.12.30 source
        working-directory: kernel/common
        shell: bash
        run: |
          set -eux

          git fetch --depth=1 \
            https://android.googlesource.com/kernel/common \
            android16-6.12-2025-07_r7

          git checkout --detach FETCH_HEAD

          echo "=== SOURCE COMMIT ==="
          git rev-parse HEAD

          test "$(git rev-parse HEAD)" = \
            "6e872b4863d6dd892490c32d973db1a9df8d3710"

          echo "=== EXACT ANDROID R7 SOURCE VERIFIED ==="


      - name: Enable MT7612U
        working-directory: kernel/common
        shell: bash
        run: |
          set -eux

          DEFCONFIG="arch/arm64/configs/gki_defconfig"

          for line in \
            "CONFIG_CFG80211=m" \
            "CONFIG_MAC80211=m" \
            "CONFIG_WLAN_VENDOR_MEDIATEK=y" \
            "CONFIG_MT76_CORE=m" \
            "CONFIG_MT76_USB=m" \
            "CONFIG_MT76X02_LIB=m" \
            "CONFIG_MT76X02_USB=m" \
            "CONFIG_MT76X2_COMMON=m" \
            "CONFIG_MT76X2U=m"
          do
            key="${line%%=*}"
            value="${line#*=}"

            if grep -q "^${key}=" "$DEFCONFIG"; then
              sed -i "s/^${key}=.*/${line}/" "$DEFCONFIG"
            elif grep -q "^# ${key} is not set" "$DEFCONFIG"; then
              sed -i "s/^# ${key} is not set/${line}/" "$DEFCONFIG"
            else
              echo "$line" >> "$DEFCONFIG"
            fi
          done

          echo "=== MT7612U CONFIG APPLIED ==="

          grep -E \
            '^(CONFIG_CFG80211|CONFIG_MAC80211|CONFIG_WLAN_VENDOR_MEDIATEK|CONFIG_MT76)' \
            "$DEFCONFIG"

      - name: Verify MT7612U configuration
        working-directory: kernel/common
        shell: bash
        run: |
          set -eux

          echo "=== MT76 CONFIGURATION ==="

          grep -E \
            '^(CONFIG_CFG80211|CONFIG_MAC80211|CONFIG_WLAN_VENDOR_MEDIATEK|CONFIG_MT76)' \
            arch/arm64/configs/gki_defconfig
            
          
      - name: Build GKI and modules
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          sed -i \
            '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' \
            common/BUILD.bazel

          echo "=== STARTING BAZEL KERNEL BUILD ==="

          tools/bazel build \
            --config=fast \
            --config=stamp \
            --disk_cache=/home/runner/.cache/bazel \
            --allow_undeclared_modules \
            --preserve_kbuild_output \
            --verbose_failures \
            --subcommands \
            --output_groups=modules_staging_archive \
            //common:kernel_aarch64

          echo "=== BAZEL BUILD FINISHED ==="
      
          
      - name: Collect MT76 modules
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          rm -rf mt76-artifact
          rm -rf mt76-staging

          mkdir -p mt76-artifact
          mkdir -p mt76-staging

          echo "=== FINDING MODULE STAGING ARCHIVE ==="

                    ARCHIVE="$(find bazel-bin/common/kernel_aarch64 \
            -type f \
            \( \
              -name 'modules_staging_dir.tar.gz' -o \
              -name 'module_staging_dir.tar.gz' \
            \) \
            -print -quit)"


          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: module_staging_dir.tar.gz was not produced"

            echo "=== AVAILABLE OUTPUTS ==="
            find bazel-bin/common/kernel_aarch64 \
              -maxdepth 5 \
              -type f \
              -print | head -300

            exit 1
          fi

          echo "=== ARCHIVE FOUND ==="
          echo "$ARCHIVE"

          echo "=== EXTRACTING MODULE STAGING ==="

          tar -xzf "$ARCHIVE" -C mt76-staging

          echo "=== SEARCHING FOR MT76 ==="

          find mt76-staging -type f \( \
            -name 'mt76.ko' -o \
            -name 'mt76-usb.ko' -o \
            -name 'mt76x02-lib.ko' -o \
            -name 'mt76x02-usb.ko' -o \
            -name 'mt76x2-common.ko' -o \
            -name 'mt76x2u.ko' \
          \) -print

          echo "=== COPYING MT76 MODULES ==="

          for name in \
            mt76.ko \
            mt76-usb.ko \
            mt76x02-lib.ko \
            mt76x02-usb.ko \
            mt76x2-common.ko \
            mt76x2u.ko
          do
            src="$(find mt76-staging \
              -type f \
              -name "$name" \
              -print -quit)"

            if [ -z "$src" ]; then
              echo "ERROR: REQUIRED MODULE NOT FOUND: $name"
              exit 1
            fi

            echo "COPYING: $src"
            cp -L "$src" "mt76-artifact/$name"
          done

          echo "=== COLLECTED MT76 MODULES ==="
          ls -lh mt76-artifact/

          echo "=== VERIFYING ALL SIX MODULES ==="

          test -s mt76-artifact/mt76.ko
          test -s mt76-artifact/mt76-usb.ko
          test -s mt76-artifact/mt76x02-lib.ko
          test -s mt76-artifact/mt76x02-usb.ko
          test -s mt76-artifact/mt76x2-common.ko
          test -s mt76-artifact/mt76x2u.ko

          echo "=== SUCCESS: ALL SIX MT76 MODULES COLLECTED ==="
      - name: Check module metadata
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          for f in mt76-artifact/*.ko; do
            echo "================================"
            echo "$f"
            echo "================================"

            strings "$f" | \
              grep -E '^(name=|depends=|vermagic=)' || true
          done

      - name: Upload MT7612U modules
        uses: actions/upload-artifact@v4
        with:
          name: MT7612U-Wild-6.12.30-r7
          path: kernel/mt76-artifact/
          if-no-files-found: error
