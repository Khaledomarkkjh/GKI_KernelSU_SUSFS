name: Build MT7612U

on:
  workflow_dispatch:

jobs:
  build-mt7612u:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Wild build environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: android16-6.12
          sublevel: "30"

      - name: Download Android 16 kernel
        uses: ./.github/actions/download-kernel
        with:
          version: android16-6.12
          android_version: android16
          kernel_version: "6.12"
          os_patch_level: "2025-07"
          
      - name: Fix Kleaf header glob
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          FILE="build/kernel/kleaf/impl/kernel_build.bzl"

          grep -nF -- '-name *.h -print0' "$FILE"

          sed -i "s/-name \*\.h -print0/-name '*.h' -print0/g" "$FILE"

          echo "=== KLEAF HEADER GLOB FIXED ==="
          grep -nF -- "-name '*.h' -print0" "$FILE"

          
      - name: Pin exact Android 16 6.12.30 source
        working-directory: kernel/common
        shell: bash
        run: |
          set -eux

          git fetch --depth=1 \
            https://android.googlesource.com/kernel/common \
            android16-6.12-2025-07_r7

          git checkout --detach FETCH_HEAD

          echo "=== SOURCE COMMIT ==="
          git rev-parse HEAD

          test "$(git rev-parse HEAD)" = \
            "6e872b4863d6dd892490c32d973db1a9df8d3710"

          echo "=== EXACT ANDROID R7 SOURCE VERIFIED ==="

      - name: Prepare MT76 external module
        working-directory: kernel/common
        shell: bash
        run: |
          set -eux

          echo "=== MT76 SOURCE CHECK ==="

          test -f drivers/net/wireless/mediatek/mt76/Makefile
          test -f drivers/net/wireless/mediatek/mt76/Kconfig
          test -f drivers/net/wireless/mediatek/mt76/mt76.h
          test -f drivers/net/wireless/mediatek/mt76/mt76x2/Makefile

          echo "=== MT76X2U CONFIG ==="
          grep -A8 -B2 'config MT76x2U' \
            drivers/net/wireless/mediatek/mt76/mt76x2/Kconfig

          echo "=== MT76 MAKEFILE ==="
          grep -E 'mt76x2-common|mt76x2u' \
            drivers/net/wireless/mediatek/mt76/mt76x2/Makefile

          echo "=== MT76 SOURCE VERIFIED ==="
      
      - name: Create MT76 Bazel target
        working-directory: kernel/common
        shell: bash
        run: |
          set -eux

          cat > drivers/net/wireless/mediatek/mt76/BUILD.bazel <<'EOF'
          load("//build/kernel/kleaf:kernel.bzl", "kernel_module")

          kernel_module(
              name = "mt76",
              kernel_build = "//common:kernel_aarch64",
              makefile = "Makefile",
              srcs = glob([
                  "**/*.c",
                  "**/*.h",
                  "**/Makefile",
                  "**/Kconfig",
                  "**/Kbuild",
              ]),
              outs = [
                  "mt76.ko",
                  "mt76-usb.ko",
                  "mt76x02-lib.ko",
                  "mt76x02-usb.ko",
                  "mt76x2/mt76x2-common.ko",
                  "mt76x2/mt76x2u.ko",
              ],
          )
          EOF

          echo "=== MT76 BUILD.BAZEL ==="
          cat drivers/net/wireless/mediatek/mt76/BUILD.bazel

          echo "=== BAZEL PACKAGE CHECK ==="
                  ../tools/bazel query //common/drivers/net/wireless/mediatek/mt76:mt76

      - name: Build MT76
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          echo "=== BUILDING MT76 EXTERNAL MODULE ==="

          tools/bazel build \
            --config=fast \
            --config=stamp \
            --disk_cache=/home/runner/.cache/bazel \
            --allow_undeclared_modules \
            --preserve_kbuild_output \
            --verbose_failures \
            --subcommands \
            //common/drivers/net/wireless/mediatek/mt76:mt76

          echo "=== MT76 BUILD FINISHED ==="

          echo "=== MT76 OUTPUTS ==="
          find bazel-bin \
            -type f \
            \( \
              -name 'mt76.ko' -o \
              -name 'mt76-usb.ko' -o \
              -name 'mt76x02-lib.ko' -o \
              -name 'mt76x02-usb.ko' -o \
              -name 'mt76x2-common.ko' -o \
              -name 'mt76x2u.ko' \
            \) \
            -print

      - name: Collect MT76 modules
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          rm -rf mt76-artifact
          mkdir -p mt76-artifact

          for name in \
            mt76.ko \
            mt76-usb.ko \
            mt76x02-lib.ko \
            mt76x02-usb.ko \
            mt76x2-common.ko \
            mt76x2u.ko
          do
            src="$(find bazel-bin \
              -type f \
              -name "$name" \
              -print -quit)"

            if [ -z "$src" ]; then
              echo "ERROR: REQUIRED MODULE NOT FOUND: $name"
              exit 1
            fi

            echo "COPYING: $src"
            cp -L "$src" "mt76-artifact/$name"
          done

          echo "=== ALL SIX MT76 MODULES ==="
          ls -lh mt76-artifact/

          echo "=== MODULE METADATA ==="
          for f in mt76-artifact/*.ko; do
            echo "================================"
            echo "$f"
            strings "$f" | \
              grep -E '^(name=|depends=|vermagic=)' || true
          done

      - name: Upload MT7612U modules
        uses: actions/upload-artifact@v4
        with:
          name: MT7612U-Wild-6.12.30-r7
          path: kernel/mt76-artifact/
          if-no-files-found: error
